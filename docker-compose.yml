services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-docker-local-secret-minimum-32-bytes}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      POSTGRES_DB: ${POSTGRES_DB:-qrib}
      POSTGRES_USER: ${POSTGRES_USER:-qrib}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      QRIB_AGENT_MODEL: ${QRIB_AGENT_MODEL:-gpt-4.1-mini}
      QRIB_OTP_CODE_LENGTH: ${QRIB_OTP_CODE_LENGTH:-6}
      QRIB_OTP_TTL_MINUTES: ${QRIB_OTP_TTL_MINUTES:-5}
      QRIB_RETURN_OTP_IN_RESPONSE: ${QRIB_RETURN_OTP_IN_RESPONSE:-true}
      QRIB_REQUEST_OTP_RATE: ${QRIB_REQUEST_OTP_RATE:-5/min}
      QRIB_VERIFY_OTP_RATE: ${QRIB_VERIFY_OTP_RATE:-10/min}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qrib}
      POSTGRES_USER: ${POSTGRES_USER:-qrib}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
